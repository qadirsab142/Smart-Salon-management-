    function bookingBack(){if(booking.step>1){booking.step--;renderBooking()}}
    function bookingNext(){const err=document.getElementById('booking-error');err.textContent='';if(booking.step===1&&!booking.service){err.textContent='Please choose a service.';return}if(booking.step===2&&!booking.date){err.textContent='Please choose a date.';return}if(booking.step===3&&!booking.time){err.textContent='Please choose an available time.';return}if(booking.step===4){confirmBooking();return}booking.step++;renderBooking()}
    function renderBooking(){const c=document.getElementById('booking-step-content'),label=document.getElementById('booking-step-label'),back=document.getElementById('booking-back'),next=document.getElementById('booking-next');back.classList.toggle('hide',booking.step===1);next.textContent=booking.step===4?'Confirm Appointment':'Continue';label.textContent='Step '+booking.step+' of 4';if(booking.step===1)c.innerHTML='<div class="grid gap-3 sm:grid-cols-2">'+services.map(s=>'<button type="button" class="booking-choice '+(booking.service&&booking.service.name===s.name?'selected':'')+' p-4 text-left" onclick="booking.service=services['+services.indexOf(s)+'];renderBooking()"><strong>'+s.name+'</strong><span class="mt-2 block text-sm text-stone-400">'+s.duration+' · Rs. '+s.price.toLocaleString()+'</span></button>').join('')+'</div>';else if(booking.step===2)c.innerHTML='<label class="block text-sm font-bold" for="booking-date-input">Choose Date</label><input id="booking-date-input" type="date" min="2026-09-11" value="'+booking.date+'" onchange="booking.date=this.value" class="mt-3 w-full border border-stone-700 bg-[#101010] p-3 text-white outline-none focus:border-[#bd8755]">';else if(booking.step===3)c.innerHTML='<p class="text-sm text-stone-300">Choose an available time</p><div class="mt-4 flex flex-wrap gap-2">'+['10:00 AM','10:30 AM','12:30 PM','3:30 PM','5:00 PM'].map(t=>'<button type="button" class="booking-choice '+(booking.time===t?'selected':'')+' px-4 py-2 text-sm" onclick="booking.time=\''+t+'\';renderBooking()">'+t+'</button>').join('')+'</div>';else{const s=booking.stylist==='recommend'?null:stylists[booking.stylist];c.innerHTML='<div class="grid gap-3 sm:grid-cols-2"><button type="button" class="booking-choice '+(booking.stylist==='recommend'?'selected':'')+' p-4 text-left" onclick="booking.stylist=\'recommend\';renderBooking()"><strong>Let Salon Recommend a Stylist</strong><span class="mt-2 block text-sm text-stone-400">We will recommend the most suitable available stylist.</span></button>'+Object.keys(stylists).map(id=>'<button type="button" class="booking-choice '+(booking.stylist===id?'selected':'')+' p-4 text-left" onclick="booking.stylist=\''+id+'\';renderBooking()"><strong>'+stylists[id].name+'</strong><span class="mt-2 block text-sm text-stone-400">'+stylists[id].role+' · ★ '+stylists[id].rating+'</span></button>').join('')+'</div><div class="mt-6 border-t border-white/10 pt-5 text-sm leading-7 text-stone-300"><strong class="text-[#d7a979]">Appointment Summary</strong><br>Customer: '+user.name+'<br>Service: '+booking.service.name+' · '+booking.service.duration+'<br>Date: '+booking.date+' at '+booking.time+'<br>Stylist: '+(s?s.name:'Smart Salon recommendation')+'<br>Total: Rs. '+booking.service.price.toLocaleString()+'</div>'}} 
    function confirmBooking(){const chosen=booking.stylist==='recommend'?stylists.ahmed:stylists[booking.stylist];const date=new Date(booking.date+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});const a={id:'SS-'+Math.floor(1000+Math.random()*8999),service:booking.service.name,stylist:chosen.name,date,time:booking.time,price:booking.service.price,status:'Confirmed'};appointments.unshift(a);document.getElementById('booking-form').classList.add('hide');document.getElementById('booking-success').classList.remove('hide');document.getElementById('booking-confirmation-details').innerHTML='<strong>Booking ID</strong>: '+a.id+'<br><strong>Service</strong>: '+a.service+'<br><strong>Stylist</strong>: '+a.stylist+'<br><strong>Date</strong>: '+a.date+'<br><strong>Time</strong>: '+a.time;lucide.createIcons()}
    function openProfile(id){const s=stylists[id],image='stylist-'+id+'-image';document.getElementById('profile-modal-content').innerHTML='<div class="grid gap-7 sm:grid-cols-[220px_1fr]"><img data-template-id="'+image+'" loading="lazy" class="canva-image h-72 w-full object-cover"><div><p class="section-kicker">Stylist profile</p><h2 id="profile-modal-name" class="display mt-2 text-4xl">'+s.name+'</h2><p class="mt-2 text-[#d7a979]">'+s.role+'</p><p class="mt-5 text-sm text-stone-300">'+s.experience+' · ★ '+s.rating+'</p><p class="mt-5 leading-relaxed text-stone-400">'+s.bio+'</p><p class="mt-5 text-sm text-stone-300"><strong class="text-[#d7a979]">Services:</strong> '+s.services+'</p><p class="mt-2 text-sm text-[#b5d6aa]">'+s.availability+'</p><button class="bronze-button mt-6 px-5 py-3 text-sm font-bold" onclick="closeModal(\'profile-modal\');requestBooking(\'\',\''+id+'\')">Book with this stylist</button></div></div>';openModal('profile-modal');lucide.createIcons()}
    function filterStylists(){const q=document.getElementById('stylist-search').value.toLowerCase(),service=document.getElementById('service-filter').value,available=document.getElementById('availability-filter').value,sort=document.getElementById('sort-filter').value;const cards=[...document.querySelectorAll('.stylist-card')];cards.sort((a,b)=>Number(b.dataset[sort])-Number(a.dataset[sort])).forEach(card=>document.getElementById('stylist-grid').appendChild(card));let count=0;cards.forEach(c=>{const ok=(c.dataset.name.toLowerCase()+c.textContent.toLowerCase()).includes(q)&&(service==='all'||c.dataset.services.includes(service))&&(available==='all'||c.dataset.availability===available);c.classList.toggle('hide',!ok);if(ok)count++});document.getElementById('stylist-results').textContent=count+' stylist'+(count===1?'':'s')+' found';document.getElementById('no-stylists').classList.toggle('hide',count!==0)}
    function dashboardTab(tab,button){['overview','appointments','history','profile'].forEach(x=>document.getElementById('dash-'+x).classList.toggle('hide',x!==tab));document.querySelectorAll('.dashboard-side button').forEach(x=>x.classList.remove('active'));button.classList.add('active');renderDashboard()}
    function appointmentCard(a){const cl=a.status==='Cancelled'?'status-cancelled':a.status==='Pending'?'status-pending':'status-confirmed';return '<article class="salon-card rounded-sm p-5"><div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-center"><div><h3 class="font-bold">'+a.service+' <span class="ml-2 rounded-full px-2 py-1 text-xs '+cl+'">'+a.status+'</span></h3><p class="mt-2 text-sm text-stone-400">'+a.stylist+' · '+a.date+' at '+a.time+'</p><p class="mt-1 text-sm text-[#d7a979]">Rs. '+a.price.toLocaleString()+'</p></div>'+(a.status==='Confirmed'?'<div class="flex gap-2"><button class="outline-button px-3 py-2 text-xs" onclick="reschedule(\''+a.id+'\')">Reschedule</button><button class="border border-red-300/30 px-3 py-2 text-xs text-red-200" onclick="cancelAppointment(\''+a.id+'\')">Cancel</button></div>':'')+'</div></article>'}
    function renderDashboard(){document.getElementById('dashboard-greeting').textContent='Good morning, '+user.name.split(' ')[0]+'.';const active=appointments.filter(a=>a.status==='Confirmed');document.getElementById('metric-upcoming-value').textContent=active.length;document.getElementById('upcoming-card').innerHTML=active[0]?appointmentCard(active[0]):'<p class="py-8 text-stone-500">No upcoming appointments. Your next great look is one booking away.</p>';document.getElementById('appointments-list').innerHTML=appointments.map(appointmentCard).join('');renderHistory();document.getElementById('profile-name-input').value=user.name;document.getElementById('profile-email-input').value=user.email;document.getElementById('profile-phone-input').value=user.phone}
    function reschedule(id){const a=appointments.find(x=>x.id===id);a.time=a.time==='3:30 PM'?'5:00 PM':'3:30 PM';a.status='Pending';renderDashboard()}
    function cancelAppointment(id){const a=appointments.find(x=>x.id===id);a.status='Cancelled';renderDashboard()}
    function filterHistory(f){historyFilter=f;renderHistory()}
    function renderHistory(){const rows=appointments.filter(a=>historyFilter==='all'||a.status===historyFilter);document.getElementById('history-list').innerHTML=rows.length?rows.map(appointmentCard).join(''):'<p class="py-8 text-stone-500">No appointments in this category.</p>'}
    function saveProfile(e){e.preventDefault();user.name=document.getElementById('profile-name-input').value;user.email=document.getElementById('profile-email-input').value;user.phone=document.getElementById('profile-phone-input').value;document.getElementById('profile-message').textContent='Profile saved successfully.';renderDashboard()}
    window.addEventListener('scroll',()=>document.getElementById('site-header').classList.toggle('shadow-2xl',window.scrollY>20));
    document.getElementById('whatsapp-link').href='https://wa.me/'+WHATSAPP_NUMBER+'?text=Hi%20Smart%20Salon%2C%20I%27d%20like%20to%20book%20an%20appointment.';
    filterStylists();lucide.createIcons();
  </script>
 </body>
